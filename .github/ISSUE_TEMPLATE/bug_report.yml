name: Bug report
description: Something in TOKI does not behave the way it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security issues here. Use
        [SECURITY.md](https://github.com/mrcrapto/toki/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: TOKI version
      description: Settings > About, or the installer filename.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: checkboxes
    id: providers
    attributes:
      label: Which providers are switched on
      options:
        - label: Claude
        - label: Codex
        - label: Cursor
        - label: GLM

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Switch on Cursor
        2. Hover the ring
        3. ...
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Relevant lines from the log
      description: |
        `%APPDATA%\TOKI\toki.log`. It contains no credentials, but it does
        contain paths from your profile and session names, so read it before
        pasting.
      render: text
