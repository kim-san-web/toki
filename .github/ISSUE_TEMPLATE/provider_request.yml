name: Provider request
description: A coding tool TOKI should be able to read.
labels: [provider]
body:
  - type: input
    id: tool
    attributes:
      label: Which tool
      placeholder: "Windsurf, Aider, Continue, ..."
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Where does it keep its usage state on Windows
      description: |
        A path, an endpoint, or a local database. TOKI only ever reads the same
        place the owning tool itself reads, so a request without a source is
        hard to act on.
    validations:
      required: true

  - type: dropdown
    id: modes
    attributes:
      label: Which credential modes could work
      multiple: true
      options:
        - Borrow what the tool already holds on this PC
        - A real OAuth sign-in
        - A pasted API key
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: A sample response or record
      description: Scrub anything that identifies your account before pasting.
      render: json
